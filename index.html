<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crénolia — Réservations</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0066CC;--blue-dk:#0052A3;--blue-lt:#EBF4FB;--blue-brd:#D5E8F7;--txt:#1A2E45;--muted:#7A97B5;--bg:#F3F7FC;--wh:#fff;--brd:#C8DDF0;--red:#C0392B;--red-lt:#FEF5F5}
html,body{height:100%;font-family:"Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--txt)}
#hdr{background:var(--wh);border-bottom:2px solid var(--blue-brd);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:8px;flex-wrap:wrap}
#hdr img{height:36px;width:auto}
#nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb{padding:7px 14px;border-radius:20px;border:1.5px solid var(--blue-brd);cursor:pointer;font-weight:500;font-size:13px;background:transparent;color:#666;font-family:inherit}
.nb.on{background:var(--blue-lt);color:var(--blue-dk);border:none}
.btn-new{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--blue);color:var(--wh);font-family:inherit}
#sp{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:1.5px solid var(--blue-brd);font-family:inherit;transition:all .3s}
#sp.ok{background:#EBF7E3;color:#2C6E12;border-color:#A8D5A2}
#sp.syncing{background:#FFF5E6;color:#7A4800;border-color:#FFD699}
#sp.err{background:var(--red-lt);color:var(--red);border-color:#F5C6C2}
#sp.off{background:var(--bg);color:var(--muted);border-color:var(--blue-brd)}
.sdot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite}
#main{max-width:860px;margin:0 auto;padding:24px 16px}
.card{background:var(--wh);border-radius:12px;border:1.5px solid var(--blue-brd);padding:14px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.card.subc{border-color:#F0C080;background:#FFFDF7}
.cn{font-size:16px;font-weight:700;color:#0E3460;margin-bottom:3px}
.cm{font-size:12px;color:var(--muted);margin-bottom:8px}
.ct{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.cd{font-size:11px;color:#99B0C8}
.ca{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.tag{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.tb{background:var(--blue-lt);color:var(--blue-dk)}.tg{background:#EBF7E3;color:#2C6E12}.to{background:#FFF5E6;color:#7A4800}.tst{background:#FFF0E0;color:#9B5500;border:1px solid #F0C080}
.btn{padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;border:none;font-family:inherit}
.bb{background:var(--blue);color:var(--wh)}.bo{background:var(--wh);color:var(--blue);border:1.5px solid var(--blue)!important}.bg{background:var(--bg);color:#555}.br{background:var(--red-lt);color:var(--red)}.brc{background:#FDECEA;color:var(--red)}.bor{background:#FFF0E0;color:#9B5500;border:1.5px solid #F0C080!important}.bcal{background:#fff;color:#34A853;border:1.5px solid #34A853!important}
.blg{flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;background:var(--blue);color:var(--wh)}
.st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;color:var(--muted)}.st.dm{color:#B0C4D8}
.emp{text-align:center;padding:60px 0}
.fw{max-width:580px;margin:0 auto}
.ft{font-size:19px;font-weight:700;color:#0E3460;margin-bottom:20px}
.sb{margin-bottom:18px}
.sbh{background:var(--blue);color:var(--wh);padding:6px 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:12px;letter-spacing:1.2px}
.sbh.org{background:#E67E22}
.sbb{background:var(--wh);border:1.5px solid var(--blue-brd);border-top:none;border-radius:0 0 10px 10px;padding:14px 16px}
.sbb.orgb{border-color:#F0C080;background:#FFFDF7}
.fl{margin-bottom:10px}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px}
.fl label.er{color:var(--red)}
.fl input,.fl select{width:100%;padding:8px 11px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:var(--wh);color:var(--txt)}
.fl input.er,.fl select.er{border-color:#E74C3C}
.fl input:focus,.fl select:focus{border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ae{background:#FEF0EF;border:1.5px solid #F5C6C2;border-radius:8px;padding:9px 13px;margin-bottom:14px;color:var(--red);font-size:13px}
.chk-row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;user-select:none}
.chk-row input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:#E67E22}
.chk-label{font-size:13px;font-weight:600;color:#9B5500}
.sub-info{background:#FFF8EE;border:1px solid #F0C080;border-radius:8px;padding:9px 13px;font-size:12px;color:#7A4800;margin-bottom:10px;line-height:1.6}
#vw{min-height:100vh;background:var(--bg)}
#vtb{background:var(--wh);border-bottom:1.5px solid var(--blue-brd);padding:10px 20px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap}
#vtb span{color:var(--muted);font-size:13px;margin-left:4px}
#vdoc{max-width:680px;margin:18px auto;background:var(--wh);padding:30px 42px;box-shadow:0 2px 20px rgba(0,0,0,.07);border-radius:4px}
.vt{text-align:center;font-weight:700;font-size:12.5px;margin-bottom:3px}
.vs2{text-align:center;font-size:10.5px;color:#555;line-height:1.5;margin-bottom:16px}
.va{font-size:11px;line-height:1.7;color:#333;margin-bottom:20px}
.vsec{background:var(--blue);color:var(--wh);padding:5px 12px;font-weight:700;font-size:11px;letter-spacing:1.2px}
.vsec.org{background:#E67E22}
.vtbl{width:100%;border-collapse:collapse;margin-bottom:12px}
.vtbl td{padding:5px 11px;border-bottom:1px dashed var(--brd);vertical-align:top;font-size:11.5px;line-height:1.3}
.vtbl td:first-child{width:190px;font-weight:600;color:#444;font-size:11px}
.vtbl .bld td:last-child{font-weight:700}
.vf{text-align:center;padding-top:12px;border-top:1px solid #E8E8E8;margin-top:6px}
.vf img{height:48px;width:auto;margin:0 auto 6px;display:block}
.vft{font-size:10px;color:#666;line-height:1.7}
.sub-badge{display:inline-block;background:#FFF0E0;color:#9B5500;border:1px solid #F0C080;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
@media print{#vtb,#hdr{display:none!important}#vdoc{margin:0;padding:18px 28px;box-shadow:none;max-width:100%}body{background:#fff}.vtbl td{padding:4px 9px;font-size:10.5px}.vtbl td:first-child{font-size:10px}.vsec{padding:4px 10px;font-size:10px}.vt{font-size:11px}.vs2{font-size:10px;margin-bottom:10px}.va{font-size:10px;margin-bottom:12px}.vf img{height:38px}.vft{font-size:9px}}
#aw{position:fixed;inset:0;background:#0066CC;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ac{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:10;background:linear-gradient(to bottom,rgba(0,80,160,.6),transparent)}
#ac button{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:13px;font-family:inherit}
#an{color:#fff;font-weight:800;text-align:center;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;display:inline-block;max-width:96vw}
.anl{white-space:nowrap}
.dw{max-width:560px;margin:0 auto}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.dc{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:13px 17px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dn{font-weight:700;font-size:14px;color:#0E3460}.dm2{font-size:12px;color:var(--muted)}
.adf{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:12px;padding:18px;margin-bottom:14px}
.sw{max-width:560px;margin:0 auto}
.sbox2{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:12px;padding:20px;margin-bottom:14px}
.tip{background:#FFF5E6;border:1.5px solid #FFD699;border-radius:10px;padding:13px 17px;font-size:12px;color:#7A4800;line-height:1.7}
.ok-box{background:#EBF7E3;border:1.5px solid #A8D5A2;border-radius:12px;padding:16px 20px;margin-bottom:18px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--wh);border-radius:16px;padding:22px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:700;color:#0E3460;margin-bottom:6px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.modal textarea{width:100%;height:180px;padding:11px;border:1.5px solid var(--brd);border-radius:8px;font-size:12px;font-family:inherit;resize:vertical;outline:none;line-height:1.5}
.modal textarea:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-result{background:#F3F7FC;border:1.5px solid var(--blue-brd);border-radius:10px;padding:12px;margin-top:12px;font-size:12px;line-height:1.8}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}

/* QUOTE */
#qdoc{max-width:720px;margin:18px auto;background:var(--wh);padding:30px 42px;box-shadow:0 2px 20px rgba(0,0,0,.07);border-radius:4px}
.ql{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ql-fr{border-right:2px solid var(--blue-brd);padding-right:20px}
.ql-en{padding-left:20px;color:#555}
.q-sep{width:100%;height:1px;background:var(--blue-brd);margin:14px 0}
.q-sec{background:var(--blue);color:var(--wh);padding:5px 12px;font-weight:700;font-size:11px;letter-spacing:1.2px;margin-bottom:0}
.q-sec.en{background:#4A90D9}
.qtbl{width:100%;border-collapse:collapse;margin-bottom:12px}
.qtbl td{padding:5px 10px;border-bottom:1px dashed var(--brd);font-size:11.5px;line-height:1.3;vertical-align:top}
.qtbl td:first-child{font-weight:600;color:#444;width:160px;font-size:11px}
.qtbl .bld td:last-child{font-weight:700}
.q-price{background:#EBF4FB;border:1.5px solid var(--blue-brd);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.q-price .amt{font-size:22px;font-weight:800;color:var(--blue)}
.q-price .lbl{font-size:11px;color:var(--muted)}
.q-conditions{font-size:10.5px;color:#555;line-height:1.7;margin-bottom:10px;padding:10px 12px;background:#F9F9F9;border-radius:6px;border:1px solid #E8E8E8}
.q-validity{font-size:10.5px;font-style:italic;color:#888;margin-top:4px}
.q-footer{text-align:center;padding-top:12px;border-top:1px solid #E8E8E8;margin-top:10px}
.q-footer img{height:44px;width:auto;margin:0 auto 6px;display:block}
.q-footer-txt{font-size:9.5px;color:#666;line-height:1.7}
.q-badge{display:inline-block;background:var(--blue-lt);color:var(--blue-dk);border-radius:4px;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}
@media print{#vtb,#hdr{display:none!important}#qdoc{margin:0;padding:18px 28px;box-shadow:none;max-width:100%}body{background:#fff}}


/* CLIENTS & SERVICES */
.cs-card{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:13px 17px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cs-card:hover{border-color:var(--blue);background:var(--blue-lt)}
.cs-card.clickable{cursor:pointer;transition:all .2s}
.cs-main{flex:1;min-width:0}
.cs-name{font-weight:700;font-size:14px;color:#0E3460;margin-bottom:2px}
.cs-sub{font-size:12px;color:var(--muted);line-height:1.5}
.cs-price{font-size:18px;font-weight:800;color:var(--blue);white-space:nowrap}
.cs-lang{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--blue-lt);color:var(--blue-dk);margin-left:6px}
.cs-lang.en{background:#EBF7E3;color:#2C6E12}
.cs-note{font-size:11px;color:#99B0C8;font-style:italic;margin-top:2px}
.client-picker{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.client-picker-box{background:var(--wh);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.client-picker-box h3{font-size:15px;font-weight:700;color:#0E3460;margin-bottom:12px}
.svc-picker{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:12px;margin-bottom:10px}
.svc-picker h4{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.svc-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;cursor:pointer;transition:background .15s}
.svc-item:hover{background:var(--blue-lt)}
.svc-item-name{font-size:13px;color:#0E3460;font-weight:500}
.svc-item-price{font-size:14px;font-weight:700;color:var(--blue)}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="hdr">
  <img id="logo" alt="Crénolia">
  <div id="nav">
    <button class="nb on" onclick="showView('list')" id="nav-list">Réservations</button>
    <button class="nb" onclick="showView('drivers')" id="nav-drivers">Chauffeurs</button>
    <button class="nb" onclick="showView('clients')" id="nav-clients">👥 Clients</button>
    <button class="nb" onclick="showView('services')" id="nav-services">🗂 Services</button>
    <button class="nb" onclick="showView('settings')" id="nav-settings">⚙️ Sync</button>
    <button id="sp" class="off" onclick="syncNow()" title="Synchroniser">
      <span class="sdot" id="sdot"></span><span id="slbl">Non configuré</span>
    </button>
    <button class="btn-new" onclick="openForm(null)">+ Nouvelle</button>
  </div>
</div>
<div id="main">
  <div id="view-list"></div>
  <div id="view-form" class="hidden"></div>
  <div id="view-drivers" class="hidden"></div>
  <div id="view-settings" class="hidden"></div>
  <div id="view-clients" class="hidden"></div>
  <div id="view-services" class="hidden"></div>
</div>
<div id="view-voucher" class="hidden">
  <div id="vw">
    <div id="vtb">
      <button class="btn bg" onclick="showView('list')">← Retour</button>
      <button class="btn bb" onclick="window.print()">🖨 Imprimer</button>
      <button class="btn bor" id="btn-stv" onclick="switchVMode()" style="display:none">📋 Voir bon ST</button>
      <span id="vpn"></span>
    </div>
    <div id="vdoc"></div>
  </div>
</div>
<div id="view-accueil" class="hidden">
  <div id="aw">
    <div id="ac">
      <button onclick="showView('list')">← Retour</button>
      <button id="bfs" onclick="toggleFS()">Plein écran</button>
    </div>
    <div id="an"></div>
  </div>
</div>

<div id="view-quote" class="hidden">
  <div id="vw">
    <div id="vtb">
      <button class="btn bg" onclick="showView('list')">← Retour</button>
      <button class="btn bb" onclick="window.print()">🖨 Imprimer / PDF</button>
      <button class="btn bo" id="btn-share-quote" onclick="shareQuote()">🔗 Partager le lien</button>
      <button class="btn bg" id="btn-toggle-lang" onclick="toggleQuoteLang()">🌐 Afficher FR+EN</button>
      <span id="qpn" style="color:var(--muted);font-size:13px;margin-left:4px"></span>
    </div>
    <div id="qdoc"></div>
  </div>
</div>


<div id="client-picker" class="client-picker hidden">
  <div class="client-picker-box">
    <h3>👥 Choisir un client</h3>
    <input id="client-search" style="width:100%;padding:8px 11px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;outline:none;font-family:inherit;margin-bottom:10px" placeholder="Rechercher un client..." oninput="filterClients()">
    <div id="client-picker-list"></div>
    <button class="btn bg" style="width:100%;padding:9px;margin-top:8px;font-size:13px" onclick="document.getElementById('client-picker').classList.add('hidden')">Annuler</button>
  </div>
</div>

<div id="import-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3>🤖 Importer une réservation</h3>
    <p>Collez le texte de n&#39;importe quel <strong>email ou message</strong> contenant les infos de réservation. L&#39;IA extrait automatiquement le nom, la date, le lieu, le prix...</p>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button id="tab-email" class="btn bb" onclick="setImportTab('email')" style="font-size:12px;padding:6px 13px">✉️ Email (tout format)</button>
      <button id="tab-whatsapp" class="btn bg" onclick="setImportTab('whatsapp')" style="font-size:12px;padding:6px 13px;background:#25D366;color:#fff">💬 WhatsApp</button>
    </div>
    <div id="import-hint" style="background:#F3F7FC;border-radius:8px;padding:8px 12px;font-size:12px;color:#7A97B5;margin-bottom:8px;line-height:1.5"></div>
    <textarea id="email-input" placeholder="Collez ici..."></textarea>
    <div id="ai-result-box" class="ai-result hidden"></div>
    <div class="modal-actions">
      <button class="blg" id="btn-analyze" onclick="analyzeEmail()" style="font-size:13px">🤖 Analyser</button>
      <button class="btn bb hidden" id="btn-import-confirm" onclick="confirmImport()" style="padding:12px 18px;font-size:13px">✓ Importer</button>
      <button class="btn bg" onclick="closeImportModal()" style="padding:12px 18px;font-size:13px">Annuler</button>
    </div>
  </div>

// ── CONFIG FIREBASE ──
var CFG = {dbUrl: ''};
try { CFG = JSON.parse(localStorage.getItem('cren-cfg') || '{}'); } catch(e) {}
function saveCfg() { localStorage.setItem('cren-cfg', JSON.stringify(CFG)); }

// ── DATA ──
var RES = [], DRV = [{id:'d1', name:'Lucnor LAROCHEL', vehicle:'Tesla Model Y', plate:'GK-580-RX', updatedAt:'0'}];
function loadLocal() {
  try {
    var r = localStorage.getItem('cren-res'), d = localStorage.getItem('cren-drv');
    if (r) RES = JSON.parse(r); if (d) DRV = JSON.parse(d);
  } catch(e) {}
}
function migrateSvcNames() {
  var changed = false;
  SVC = SVC.map(function(s) {
    var n = s.name;
    if (n.indexOf('1-3 PAX') !== -1) { n = n.replace('1-3 PAX','Berline'); changed = true; }
    if (n.indexOf('4-7 PAX') !== -1) { n = n.replace('4-7 PAX','Van'); changed = true; }
    return changed ? Object.assign({}, s, {name: n, updatedAt: new Date().toISOString()}) : s;
  });
  if (changed) saveServices();
}
function saveLocal() {
  localStorage.setItem('cren-res', JSON.stringify(RES));
  localStorage.setItem('cren-drv', JSON.stringify(DRV));
}
loadLocal();

// ── SYNC FIREBASE ──
function setSS(state, lbl) {
  var p = document.getElementById('sp'), l = document.getElementById('slbl'), d = document.getElementById('sdot');
  p.className = state; l.textContent = lbl;
  d.className = 'sdot' + (state === 'syncing' ? ' spinning' : '');
}
function fbUrl() { return (CFG.dbUrl || '').replace(/\/+$/, '') + '/crenolia.json'; }
// Applique un instantané distant en local (Firebase = source de vérité)
function applyRemote(remote) {
  if (!remote) return false;
  if (Array.isArray(remote.reservations)) RES = remote.reservations;
  if (Array.isArray(remote.drivers) && remote.drivers.length) DRV = remote.drivers;
  if (Array.isArray(remote.clients))  CLI = remote.clients;
  if (Array.isArray(remote.services) && remote.services.length) SVC = remote.services;
  saveLocal(); saveClients(); saveServices();
  return true;
}
// Rafraîchit la vue courante
function renderCurrent() {
  if (CV === 'list') renderList();
  else if (CV === 'drivers') renderDrivers();
  else if (CV === 'clients') renderClients();
  else if (CV === 'services') renderServices();
}
// PULL : récupère Firebase et remplace le local. Ne repousse JAMAIS.
function pullData(silent) {
  if (!CFG.dbUrl) return Promise.resolve();
  if (!silent) setSS('syncing', 'Sync...');
  return fetch(fbUrl())
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(remote) {
      if (remote && (remote.reservations || remote.drivers || remote.clients || remote.services)) {
        applyRemote(remote); renderCurrent();
        var t = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        setSS('ok', 'OK ' + t);
      } else {
        // Firebase vide → on l'initialise une fois avec les données locales
        pushData();
      }
    })
    .catch(function(e) { setSS('err', 'Erreur sync'); console.error('pullData', e); });
}
// Bouton "Synchroniser" = pull manuel
function syncNow() {
  if (!CFG.dbUrl) { showView('settings'); return; }
  pullData(false);
}
function forcePull() {
  if (!CFG.dbUrl) return;
  if (!confirm('Importer toutes les données depuis Firebase ? Les données locales seront remplacées.')) return;
  setSS('syncing', 'Import...');
  fetch(fbUrl())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })

// PUSH : envoie tout l'état local vers Firebase (après chaque modification locale)
function pushData() {
  if (!CFG.dbUrl) return;
  saveLocal(); saveClients(); saveServices();
  setSS('syncing', 'Envoi...');
  fetch(fbUrl(), {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({reservations:RES, drivers:DRV, clients:CLI, services:SVC, at:new Date().toISOString()})})
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status);
      var t = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); setSS('ok','OK '+t); })
    .catch(function(e) { setSS('err','Erreur envoi'); console.error('pushData', e); });
}

var CV = 'list';
function showView(v) {
  if(CV==='accueil' && v!=='accueil') releaseWake();

    var el = document.getElementById('view-'+x); if (el) el.classList.toggle('hidden', x!==v);

function E(s) {
  if (s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── GOOGLE CALENDAR ──
function addToCalendar(id) {
  var r = RES.find(function(x){return x.id===id;});
  if (!r||!r.pickupDate) { alert('Date de prise en charge manquante'); return; }
  var dp = r.pickupDate.replace(/-/g,'');
  var tp = (r.pickupTime||'00:00').replace(':','')+'00';
  var startDT = dp+'T'+tp;
  var startMs = new Date(r.pickupDate+'T'+(r.pickupTime||'00:00')+':00').getTime();
  var endDate = new Date(startMs+3600000);
  var endDT = endDate.getFullYear()+String(endDate.getMonth()+1).padStart(2,'0')+String(endDate.getDate()).padStart(2,'0')+'T'+String(endDate.getHours()).padStart(2,'0')+String(endDate.getMinutes()).padStart(2,'0')+'00';
  var drv = DRV.find(function(d){return d.id===r.driverId;});
  var title = encodeURIComponent('VTC — '+(r.passengerName||'Client')+(r.flightNumber?' ('+r.flightNumber+')':''));
  var details = [];
  if (r.passengerName) details.push('Client : '+r.passengerName);
  if (r.phone) details.push('Tél : '+r.phone);
  if (r.flightNumber) details.push('Vol : '+r.flightNumber);
  if (r.passengerCount) details.push('Passagers : '+r.passengerCount);
  if (r.fare) details.push('Tarif : '+r.fare+'€');
  if (drv) details.push('Chauffeur : '+drv.name+' — '+drv.vehicle+' '+drv.plate);
  if (r.isSubcontracted&&r.subcontractorName) details.push('Sous-traitant : '+r.subcontractorName+(r.subcontractorFare?' ('+r.subcontractorFare+'€)':''));
  var loc = encodeURIComponent((r.pickupLocation||'')+(r.destination?' → '+r.destination:''));
  var url = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&dates='+startDT+'/'+endDT+'&details='+encodeURIComponent(details.join('\n'))+'&location='+loc;
  window.open(url, '_blank');
}

// Agrandit le nom au maximum pour remplir l'écran (recherche dichotomique mesurée)
function fitName(){
  var el=document.getElementById('an'), box=document.getElementById('aw');
  if(!el||!box||CV!=='accueil') return;
  var maxW=box.clientWidth*0.92, maxH=box.clientHeight*0.86;
  if(maxW<=0||maxH<=0) return;
  var lo=12, hi=Math.max(window.innerWidth,window.innerHeight)*1.2, best=lo;
  for(var i=0;i<24;i++){
    var mid=(lo+hi)/2;
    el.style.fontSize=mid+'px';
    if(el.scrollWidth<=maxW && el.scrollHeight<=maxH){ best=mid; lo=mid; } else { hi=mid; }
  }
  el.style.fontSize=Math.floor(best)+'px';
}
window.addEventListener('resize',function(){ if(CV==='accueil') fitName(); });
window.addEventListener('orientationchange',function(){ setTimeout(function(){ if(CV==='accueil') fitName(); },300); });

// ── ANALYSEUR LOCAL (sans IA, gratuit, privé, hors-ligne) ──
function _monthNum(s){
  s=(s||'').toLowerCase().slice(0,4);
  var m={jan:1,fev:2,'fév':2,feb:2,mar:3,avr:4,apr:4,mai:5,may:5,jui:6,jun:6,juin:6,jul:7,aou:8,aug:8,'aoû':8,sep:9,oct:10,nov:11,dec:12,'déc':12};
  for(var k in m){ if(s.indexOf(k)===0) return m[k]; }
  return 0;
}
function _pad(n){ n=String(n); return n.length<2?'0'+n:n; }
function _toISO(y,mo,d){ if(!y||!mo||!d)return ''; y=String(y); if(y.length===2)y='20'+y; return y+'-'+_pad(mo)+'-'+_pad(d); }
function parseLocal(text){
  var now=new Date(), Y=now.getFullYear();
  var d={passengerName:'',phone:'',passengerCount:'',pickupDate:'',pickupTime:'',pickupLocation:'',destination:'',flightNumber:'',fare:'',
    orderedAt:now.toLocaleDateString('fr-FR')+' '+now.toTimeString().slice(0,5)};
  text = text.replace(/^\s*\[\d{1,2}:\d{2}(?::\d{2})?,?\s*\d{1,2}\/\d{1,2}\/\d{2,4}\]\s*[^:\n]{0,40}:\s?/gm, '');
  var lines=text.split(/\r?\n/);
  function after(labels, allowNext){
    for(var k=0;k<labels.length;k++){
      var labLow=labels[k].toLowerCase();
      for(var i=0;i<lines.length;i++){
        var line=lines[i], low=line.toLowerCase(), idx=low.indexOf(labLow);
        if(idx===-1) continue;
        var before=idx===0?'':low.charAt(idx-1);
        var afterCh=low.charAt(idx+labLow.length);
        if(/[a-zà-ÿ0-9]/.test(before)) continue;       // collé à un mot avant
        if(/[a-zà-ÿ]/.test(afterCh)) continue;           // collé à un mot après
        var rest=line.slice(idx+labels[k].length).replace(/^[:\s.\-]+/,'').trim();
        if(rest) return rest;
        if(allowNext){ for(var j=i+1;j<lines.length;j++){ if(lines[j].trim()) return lines[j].trim(); } }
      }
    }
    return '';
  }
  var ph=text.match(/(\+?\d[\d\s().\-]{7,}\d)/);
  if(ph) d.phone=ph[1].replace(/[\s().\-]+/g,'').replace(/^00/,'+');
  var pc=text.match(/(\d+)[ \t]{0,2}(?:x[ \t]*)?(?:adults?|passengers?|pax|personnes?|participant|adultes?|people|voyageurs?)\b/i);
  if(pc) d.passengerCount=pc[1];
  else { var pax=after(['PAX','Nombre de participant','Passagers','Participants'],false); var pm=pax.match(/\d+/); if(pm) d.passengerCount=pm[0]; }
  var fare=text.match(/(\d{1,5}(?:[.,]\d{1,2})?)\s*(?:€|EUR)/i)
        || text.match(/(?:€|EUR|prix|amount|tarif|montant|price)\s*:?\s*(\d{1,5}(?:[.,]\d{1,2})?)/i);
  if(fare){ d.fare=fare[1].replace(',','.').replace(/\.00$/,''); }
  var iso=text.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/);
  var enUS=text.match(/\b([A-Za-zéûàô]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*'?(\d{2,4})\b/);
  var enDM=text.match(/\b(\d{1,2})(?:st|nd|rd|th)?[.\s]+([A-Za-zéûàô]{3,9})\.?\s*'?(\d{2,4})\b/);
  var dmy=text.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](20\d{2}|\d{2})\b/);
  if(iso) d.pickupDate=_toISO(iso[1],iso[2],iso[3]);
  else if(enDM && _monthNum(enDM[2])) d.pickupDate=_toISO(enDM[3],_monthNum(enDM[2]),enDM[1]);
  else if(enUS && _monthNum(enUS[1])) d.pickupDate=_toISO(enUS[3],_monthNum(enUS[1]),enUS[2]);
  else if(dmy) d.pickupDate=_toISO(dmy[3],dmy[2],dmy[1]);
  var tm=text.match(/(\d{1,2}):(\d{2})\s*([ap]\.?m\.?)/i)
      || text.match(/(?:heure|time|pickup|pick-up|départ|depart|arriv)\D{0,12}(\d{1,2}):(\d{2})/i)
      || text.match(/\b(\d{1,2}):(\d{2})\b/);
  if(tm){ var H=parseInt(tm[1],10), M=tm[2], ap=(tm[3]||'').toLowerCase();
    if(ap.indexOf('p')===0 && H<12) H+=12; if(ap.indexOf('a')===0 && H===12) H=0;
    d.pickupTime=_pad(H)+':'+M; }
  var fl=text.match(/(?:flight|vol)[^A-Za-z\d]{0,12}([A-Z]{2,3}\s?\d{2,4})/i) || text.match(/\b([A-Z]{2,3}\d{2,4})\b/);
  if(fl) d.flightNumber=fl[1].replace(/\s+/g,'').toUpperCase();
  d.passengerName=after(['Client·e principal·e','Client principal','Customer','Nom du passager','Nom passager','Voyageur','Passager','Passenger','Name','Nom','Client'],false);
  d.passengerName=d.passengerName.replace(/\S+@\S+/,'').replace(/\s{2,}/g,' ').trim();
  if(/^\d|@|http/i.test(d.passengerName)) d.passengerName='';
  var pu=after(['Pick-up','Pickup','Pick up Location','Prise en charge','Lieu de prise'],false);
  var dz=after(['Drop Off Location','Drop-off','Dropoff','Destination','Dépôt'],false);
  var fromTo=text.match(/(?:from|de)\s+([A-Za-zÀ-ÿ0-9 ,.'\-]{2,40}?)\s+(?:to|vers|jusqu'?à|->|→)\s+([A-Za-zÀ-ÿ0-9 ,.'\-]{2,40})/i);
  if(fromTo){ if(!pu) pu=fromTo[1].trim(); if(!dz) dz=fromTo[2].trim(); }
  var gyg=text.match(/De\s+(.+?)\s+vers\s+(.+)/i);
  if(gyg){ if(!pu) pu=gyg[1].trim(); if(!dz) dz=gyg[2].trim(); }
  d.pickupLocation=pu||''; d.destination=dz||'';
  return d;
}
function localEnough(d){
  var trav=0; ['pickupDate','pickupLocation','destination','pickupTime'].forEach(function(k){ if(d[k]) trav++; });
  return !!(d.passengerName && trav>=2);
}

function analyzeEmail(){
  var emailText=document.getElementById('email-input').value.trim();
  if(!emailText){alert('Collez le texte à analyser');return;}
  // 1) Analyse locale d'abord (gratuite, privée, instantanée)
  var local=parseLocal(emailText);
  if(localEnough(local)){ showImportResult(local,'(analyse locale)'); return; }
  // 2) Secours IA (Gemini) via la fonction serverless Vercel
  var btn=document.getElementById('btn-analyze');
  btn.innerHTML='<span class="spinner"></span>Analyse IA...'; btn.disabled=true;
  fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:emailText,tab:importTab})})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(res){
      btn.innerHTML='🤖 Analyser'; btn.disabled=false;
      var ai=null; try{ ai=JSON.parse(String(res.raw||'').replace(/```json/g,'').replace(/```/g,'').trim()); }catch(e){}
      if(ai){
        Object.keys(local).forEach(function(k){ if(!ai[k] && local[k]) ai[k]=local[k]; });
        if(!ai.orderedAt) ai.orderedAt=local.orderedAt;
        showImportResult(ai,'(IA)');
      } else { showImportResult(local,'(analyse locale — IA indisponible)'); }
    })
    .catch(function(e){
      btn.innerHTML='🤖 Analyser'; btn.disabled=false;
      showImportResult(local,'(analyse locale — IA non disponible)');
      console.error('import IA', e);
    });

function saveClientModal() {

    phone: document.getElementById('clim-phone') ? document.getElementById('clim-phone').value.trim() : '',

    h+='<div class="cs-card clickable" onclick="pickClient(\''+c.id+'\')">'
      +'<div class="cs-main"><div class="cs-name">'+E(c.name)+'</div>'
      +'<div class="cs-sub">'+(c.phone?'📞 '+E(c.phone):'')+(c.email?' · '+E(c.email):'')+'</div>'
      +(c.address?'<div class="cs-sub" style="font-size:11px">📍 '+E(c.address)+'</div>':'')
      +'</div><div style="color:var(--blue);font-size:18px">›</div></div>';
  });
  document.getElementById('client-picker-list').innerHTML = h;
}

function pickClient(id) {
  var c=CLI.find(function(x){return x.id===id;}); if(!c)return;
  var fcn=document.getElementById('fclient-name'); if(fcn) fcn.value=c.name;
  var fcp=document.getElementById('fclient-phone'); if(fcp) fcp.value=c.phone||'';
  var fce=document.getElementById('fclient-email'); if(fce) fce.value=c.email||'';
  document.getElementById('client-picker').classList.add('hidden');
}

// ── SERVICES VIEW ──
function renderServices() {
  var el = document.getElementById('view-services');
  var list='';
  SVC.forEach(function(s){
    list+='<div class="cs-card">'
      +'<div class="cs-main"><div class="cs-name">'+E(s.name)+'</div></div>'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<div class="cs-price">'+E(s.price)+' €</div>'
      +'<button class="btn bg" style="font-size:11px;padding:5px 10px" onclick="editService(\''+s.id+'\')">✏️</button>'
      +'<button class="btn br" style="font-size:11px;padding:5px 10px" onclick="deleteService(\''+s.id+'\')">🗑</button>'
      +'</div></div>';
  });
  if(!SVC.length) list='<div style="text-align:center;padding:40px;color:#aaa"><div style="font-size:40px;margin-bottom:12px">🗂</div><p>Aucun service enregistré</p></div>';
  el.innerHTML='<div style="max-width:700px;margin:0 auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">'
    +'<h2 style="font-size:19px;font-weight:700;color:#0E3460">Services & Tarifs</h2>'
    +'<button class="btn bb" onclick="openSvcModal(null)">+ Ajouter</button></div>'
    
    + list+'</div>';
}

function editService(id) { openSvcModal(id); }

function openSvcModal(id) {
  var s = id ? SVC.find(function(x){return x.id===id;}) : null;
  var v = s || {name:'', category:'Transfert', price:''};
  var cats = ['Transfert','Mise à disposition'];
  var catOpts = cats.map(function(c){
    return '<option value="'+c+'"'+(v.category===c?' selected':'')+'>'+c+'</option>';
  }).join('');
  var existing = document.getElementById('svc-modal-overlay');
  if (existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'svc-modal-overlay';
  overlay.dataset.editId = id || '';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  var h = '<div style="background:#fff;border-radius:14px;padding:22px;max-width:460px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)" onclick="event.stopPropagation()">'
    +'<h3 style="font-size:16px;font-weight:700;color:#0E3460;margin-bottom:16px">'+(id?'Modifier le service':'Nouveau service')+'</h3>'
    +'<div class="fl"><label>Nom du service *</label><input id="svcm-name" value="'+E(v.name)+'" placeholder="Ex: CDG &#x2192; Paris &#x2014; Berline"></div>'
    +'<div class="g2">'
    +'<div class="fl"><label>Catégorie</label><select id="svcm-cat">'+catOpts+'</select></div>'
    +'<div class="fl"><label>Prix (€)</label><input id="svcm-price" type="number" min="0" value="'+E(v.price||'')+'" placeholder="60"></div>'
    +'</div>'
    +'<div style="background:#F3F7FC;border-radius:8px;padding:9px 12px;font-size:12px;color:#7A97B5;margin-bottom:14px;line-height:1.6">'
    +'&#x1F4A1; Ajoutez <strong>&#x2014; Berline</strong> ou <strong>&#x2014; Van</strong> à la fin du nom.'
    +'</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn bb" style="flex:1;padding:11px;font-size:14px" onclick="saveSvcModal()">&#x2713; Enregistrer</button>'
    +'<button class="btn bg" style="padding:11px 18px;font-size:14px" onclick="document.getElementById(&quot;svc-modal-overlay&quot;).remove()">Annuler</button>'
    +'</div></div>';
  overlay.innerHTML = h;
  document.body.appendChild(overlay);
  setTimeout(function(){ var el=document.getElementById('svcm-name'); if(el)el.focus(); }, 100);
}

function saveSvcModal(){
  var overlay = document.getElementById('svc-modal-overlay');
  var id = overlay ? overlay.dataset.editId : '';
  var name = document.getElementById('svcm-name') ? document.getElementById('svcm-name').value.trim() : '';
  if(!name){alert('Le nom est obligatoire');return;}
  var s={id:id||Date.now().toString(), updatedAt:new Date().toISOString(),
    name:name,
    category: document.getElementById('svcm-cat') ? document.getElementById('svcm-cat').value : 'Transfert',
    price: document.getElementById('svcm-price') ? document.getElementById('svcm-price').value.trim() : ''
  };
  if(id){SVC=SVC.map(function(x){return x.id===id?s:x;});}else{SVC.push(s);}
  if(overlay)overlay.remove();
  saveServices();pushData();renderServices();
}

function deleteService(id){
  if(!confirm('Supprimer ce service ?'))return;
  SVC=SVC.filter(function(s){return s.id!==id;});saveServices();pushData();renderServices();
}

// ── SERVICE PICKER (in form) ──
function openServicePicker() {
  var h='<div class="svc-picker"><h4>🗂 Choisir un service</h4>';
  SVC.forEach(function(s){
    h+='<div class="svc-item" onclick="pickService(\''+s.id+'\')">'
      +'<span class="svc-item-name">'+E(s.name)+'</span>'
      +'<span class="svc-item-price">'+E(s.price)+' €</span></div>';
  });
  if(!SVC.length) h+='<p style="font-size:12px;color:#aaa;text-align:center;padding:10px">Aucun service — ajoutez-en dans "🗂 Services"</p>';
  h+='</div>';
  // Show as inline dropdown under the fare field
  var existing=document.getElementById('svc-dropdown');
  if(existing){existing.remove();return;}
  var drop=document.createElement('div');
  drop.id='svc-dropdown';
  drop.innerHTML=h;
  drop.style.cssText='position:relative;z-index:50;margin-top:-8px;margin-bottom:8px';
  var ffEl=document.getElementById('ff');
  if(ffEl&&ffEl.parentNode&&ffEl.parentNode.parentNode){
    ffEl.parentNode.parentNode.appendChild(drop);
  }
}

function pickService(id){
  var s=SVC.find(function(x){return x.id===id;}); if(!s)return;
  var ff=document.getElementById('ff'); if(ff) ff.value=s.price;
  var drop=document.getElementById('svc-dropdown'); if(drop)drop.remove();
}

setImportTab('email');
renderList();

</script>
</body>
</html>
