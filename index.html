<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crénolia — Réservations</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0066CC;--blue-dk:#0052A3;--blue-lt:#EBF4FB;--blue-brd:#D5E8F7;--txt:#1A2E45;--muted:#7A97B5;--bg:#F3F7FC;--wh:#fff;--brd:#C8DDF0;--red:#C0392B;--red-lt:#FEF5F5}
html,body{height:100%;font-family:"Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--txt)}
#hdr{background:var(--wh);border-bottom:2px solid var(--blue-brd);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:8px;flex-wrap:wrap}
#hdr img{height:36px;width:auto}
#nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb{padding:7px 14px;border-radius:20px;border:1.5px solid var(--blue-brd);cursor:pointer;font-weight:500;font-size:13px;background:transparent;color:#666;font-family:inherit}
.nb.on{background:var(--blue-lt);color:var(--blue-dk);border:none}
.btn-new{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--blue);color:var(--wh);font-family:inherit}
#sp{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:1.5px solid var(--blue-brd);font-family:inherit;transition:all .3s}
#sp.ok{background:#EBF7E3;color:#2C6E12;border-color:#A8D5A2}
#sp.syncing{background:#FFF5E6;color:#7A4800;border-color:#FFD699}
#sp.err{background:var(--red-lt);color:var(--red);border-color:#F5C6C2}
#sp.off{background:var(--bg);color:var(--muted);border-color:var(--blue-brd)}
.sdot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite}
#main{max-width:860px;margin:0 auto;padding:24px 16px}
.card{background:var(--wh);border-radius:12px;border:1.5px solid var(--blue-brd);padding:14px 18px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.card.subc{border-color:#F0C080;background:#FFFDF7}
.cn{font-size:16px;font-weight:700;color:#0E3460;margin-bottom:3px}
.cm{font-size:12px;color:var(--muted);margin-bottom:8px}
.ct{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.cd{font-size:11px;color:#99B0C8}
.ca{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.tag{padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.tb{background:var(--blue-lt);color:var(--blue-dk)}.tg{background:#EBF7E3;color:#2C6E12}.to{background:#FFF5E6;color:#7A4800}.tst{background:#FFF0E0;color:#9B5500;border:1px solid #F0C080}
.btn{padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;border:none;font-family:inherit}
.bb{background:var(--blue);color:var(--wh)}.bo{background:var(--wh);color:var(--blue);border:1.5px solid var(--blue)!important}.bg{background:var(--bg);color:#555}.br{background:var(--red-lt);color:var(--red)}.brc{background:#FDECEA;color:var(--red)}.bor{background:#FFF0E0;color:#9B5500;border:1.5px solid #F0C080!important}.bcal{background:#fff;color:#34A853;border:1.5px solid #34A853!important}
.blg{flex:1;padding:12px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit;background:var(--blue);color:var(--wh)}
.st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;color:var(--muted)}.st.dm{color:#B0C4D8}
.emp{text-align:center;padding:60px 0}
.fw{max-width:580px;margin:0 auto}
.ft{font-size:19px;font-weight:700;color:#0E3460;margin-bottom:20px}
.sb{margin-bottom:18px}
.sbh{background:var(--blue);color:var(--wh);padding:6px 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:12px;letter-spacing:1.2px}
.sbh.org{background:#E67E22}
.sbb{background:var(--wh);border:1.5px solid var(--blue-brd);border-top:none;border-radius:0 0 10px 10px;padding:14px 16px}
.sbb.orgb{border-color:#F0C080;background:#FFFDF7}
.fl{margin-bottom:10px}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.6px}
.fl label.er{color:var(--red)}
.fl input,.fl select{width:100%;padding:8px 11px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:var(--wh);color:var(--txt)}
.fl input.er,.fl select.er{border-color:#E74C3C}
.fl input:focus,.fl select:focus{border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ae{background:#FEF0EF;border:1.5px solid #F5C6C2;border-radius:8px;padding:9px 13px;margin-bottom:14px;color:var(--red);font-size:13px}
.chk-row{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;user-select:none}
.chk-row input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:#E67E22}
.chk-label{font-size:13px;font-weight:600;color:#9B5500}
.sub-info{background:#FFF8EE;border:1px solid #F0C080;border-radius:8px;padding:9px 13px;font-size:12px;color:#7A4800;margin-bottom:10px;line-height:1.6}
#vw{min-height:100vh;background:var(--bg)}
#vtb{background:var(--wh);border-bottom:1.5px solid var(--blue-brd);padding:10px 20px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap}
#vtb span{color:var(--muted);font-size:13px;margin-left:4px}
#vdoc{max-width:680px;margin:18px auto;background:var(--wh);padding:30px 42px;box-shadow:0 2px 20px rgba(0,0,0,.07);border-radius:4px}
.vt{text-align:center;font-weight:700;font-size:12.5px;margin-bottom:3px}
.vs2{text-align:center;font-size:10.5px;color:#555;line-height:1.5;margin-bottom:16px}
.va{font-size:11px;line-height:1.7;color:#333;margin-bottom:20px}
.vsec{background:var(--blue);color:var(--wh);padding:5px 12px;font-weight:700;font-size:11px;letter-spacing:1.2px}
.vsec.org{background:#E67E22}
.vtbl{width:100%;border-collapse:collapse;margin-bottom:12px}
.vtbl td{padding:5px 11px;border-bottom:1px dashed var(--brd);vertical-align:top;font-size:11.5px;line-height:1.3}
.vtbl td:first-child{width:190px;font-weight:600;color:#444;font-size:11px}
.vtbl .bld td:last-child{font-weight:700}
.vf{text-align:center;padding-top:12px;border-top:1px solid #E8E8E8;margin-top:6px}
.vf img{height:48px;width:auto;margin:0 auto 6px;display:block}
.vft{font-size:10px;color:#666;line-height:1.7}
.sub-badge{display:inline-block;background:#FFF0E0;color:#9B5500;border:1px solid #F0C080;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
@media print{#vtb,#hdr{display:none!important}#vdoc{margin:0;padding:18px 28px;box-shadow:none;max-width:100%}body{background:#fff}.vtbl td{padding:4px 9px;font-size:10.5px}.vtbl td:first-child{font-size:10px}.vsec{padding:4px 10px;font-size:10px}.vt{font-size:11px}.vs2{font-size:10px;margin-bottom:10px}.va{font-size:10px;margin-bottom:12px}.vf img{height:38px}.vft{font-size:9px}}
#aw{position:fixed;inset:0;background:#0066CC;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ac{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:10;background:linear-gradient(to bottom,rgba(0,80,160,.6),transparent)}
#ac button{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:13px;font-family:inherit}
#an{color:#fff;font-weight:800;text-align:center;line-height:1.02;letter-spacing:-.02em;text-transform:uppercase;display:inline-block;max-width:96vw}
.anl{white-space:nowrap}
.dw{max-width:560px;margin:0 auto}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.dc{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:13px 17px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dn{font-weight:700;font-size:14px;color:#0E3460}.dm2{font-size:12px;color:var(--muted)}
.adf{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:12px;padding:18px;margin-bottom:14px}
.sw{max-width:560px;margin:0 auto}
.sbox2{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:12px;padding:20px;margin-bottom:14px}
.tip{background:#FFF5E6;border:1.5px solid #FFD699;border-radius:10px;padding:13px 17px;font-size:12px;color:#7A4800;line-height:1.7}
.ok-box{background:#EBF7E3;border:1.5px solid #A8D5A2;border-radius:12px;padding:16px 20px;margin-bottom:18px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--wh);border-radius:16px;padding:22px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal h3{font-size:16px;font-weight:700;color:#0E3460;margin-bottom:6px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.modal textarea{width:100%;height:180px;padding:11px;border:1.5px solid var(--brd);border-radius:8px;font-size:12px;font-family:inherit;resize:vertical;outline:none;line-height:1.5}
.modal textarea:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-result{background:#F3F7FC;border:1.5px solid var(--blue-brd);border-radius:10px;padding:12px;margin-top:12px;font-size:12px;line-height:1.8}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
#qdoc{max-width:720px;margin:18px auto;background:var(--wh);padding:30px 42px;box-shadow:0 2px 20px rgba(0,0,0,.07);border-radius:4px}
.ql{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ql-fr{border-right:2px solid var(--blue-brd);padding-right:20px}
.ql-en{padding-left:20px;color:#555}
.q-sec{background:var(--blue);color:var(--wh);padding:5px 12px;font-weight:700;font-size:11px;letter-spacing:1.2px;margin-bottom:0}
.q-sec.en{background:#4A90D9}
.qtbl{width:100%;border-collapse:collapse;margin-bottom:12px}
.qtbl td{padding:5px 10px;border-bottom:1px dashed var(--brd);font-size:11.5px;line-height:1.3;vertical-align:top}
.qtbl td:first-child{font-weight:600;color:#444;width:160px;font-size:11px}
.qtbl .bld td:last-child{font-weight:700}
.q-price{background:#EBF4FB;border:1.5px solid var(--blue-brd);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.q-price .amt{font-size:22px;font-weight:800;color:var(--blue)}
.q-price .lbl{font-size:11px;color:var(--muted)}
.q-conditions{font-size:10.5px;color:#555;line-height:1.7;margin-bottom:10px;padding:10px 12px;background:#F9F9F9;border-radius:6px;border:1px solid #E8E8E8}
.q-validity{font-size:10.5px;font-style:italic;color:#888;margin-top:4px}
.q-footer{text-align:center;padding-top:12px;border-top:1px solid #E8E8E8;margin-top:10px}
.q-footer img{height:44px;width:auto;margin:0 auto 6px;display:block}
.q-footer-txt{font-size:9.5px;color:#666;line-height:1.7}
.q-badge{display:inline-block;background:var(--blue-lt);color:var(--blue-dk);border-radius:4px;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}
@media print{#vtb,#hdr{display:none!important}#qdoc{margin:0;padding:18px 28px;box-shadow:none;max-width:100%}body{background:#fff}}
.cs-card{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:13px 17px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cs-card:hover{border-color:var(--blue);background:var(--blue-lt)}
.cs-card.clickable{cursor:pointer;transition:all .2s}
.cs-main{flex:1;min-width:0}
.cs-name{font-weight:700;font-size:14px;color:#0E3460;margin-bottom:2px}
.cs-sub{font-size:12px;color:var(--muted);line-height:1.5}
.cs-price{font-size:18px;font-weight:800;color:var(--blue);white-space:nowrap}
.cs-lang{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--blue-lt);color:var(--blue-dk);margin-left:6px}
.cs-lang.en{background:#EBF7E3;color:#2C6E12}
.cs-note{font-size:11px;color:#99B0C8;font-style:italic;margin-top:2px}
.client-picker{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.client-picker-box{background:var(--wh);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.client-picker-box h3{font-size:15px;font-weight:700;color:#0E3460;margin-bottom:12px}
.svc-picker{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:12px;margin-bottom:10px}
.svc-picker h4{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.svc-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;cursor:pointer;transition:background .15s}
.svc-item:hover{background:var(--blue-lt)}
.svc-item-name{font-size:13px;color:#0E3460;font-weight:500}
.svc-item-price{font-size:14px;font-weight:700;color:var(--blue)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="hdr">
  <img id="logo" alt="Crénolia">
  <div id="nav">
    <button class="nb on" onclick="showView('list')" id="nav-list">Réservations</button>
    <button class="nb" onclick="showView('drivers')" id="nav-drivers">Chauffeurs</button>
    <button class="nb" onclick="showView('clients')" id="nav-clients">👥 Clients</button>
    <button class="nb" onclick="showView('services')" id="nav-services">🗂 Services</button>
    <button class="nb" onclick="showView('dashboard')" id="nav-dashboard">📊 Dashboard</button>
    <button class="nb" onclick="showView('settings')" id="nav-settings">⚙️ Sync</button>
    <button id="sp" class="off" onclick="syncNow()" title="Synchroniser">
      <span class="sdot" id="sdot"></span><span id="slbl">Non configuré</span>
    </button>
    <button class="btn-new" onclick="openForm(null)">+ Nouvelle</button>
  </div>
</div>
<div id="main">
  <div id="view-list"></div>
  <div id="view-form" class="hidden"></div>
  <div id="view-drivers" class="hidden"></div>
  <div id="view-settings" class="hidden"></div>
  <div id="view-clients" class="hidden"></div>
  <div id="view-services" class="hidden"></div>
  <div id="view-dashboard" class="hidden"></div>
</div>
<div id="view-voucher" class="hidden">
  <div id="vw">
    <div id="vtb">
      <button class="btn bg" onclick="showView('list')">← Retour</button>
      <button class="btn bb" onclick="window.print()">🖨 Imprimer</button>
      <button class="btn bor" id="btn-stv" onclick="switchVMode()" style="display:none">📋 Voir bon ST</button>
      <span id="vpn"></span>
    </div>
    <div id="vdoc"></div>
  </div>
</div>
<div id="view-accueil" class="hidden">
  <div id="aw">
    <div id="ac">
      <button onclick="showView('list')">← Retour</button>
      <button id="bfs" onclick="toggleFS()">Plein écran</button>
    </div>
    <div id="an"></div>
  </div>
</div>
<div id="view-quote" class="hidden">
  <div id="vw">
    <div id="vtb">
      <button class="btn bg" onclick="showView('list')">← Retour</button>
      <button class="btn bb" onclick="window.print()">🖨 Imprimer / PDF</button>
      <button class="btn bo" id="btn-share-quote" onclick="shareQuote()">🔗 Partager le lien</button>
      <button class="btn bg" id="btn-toggle-lang" onclick="toggleQuoteLang()">🌐 Afficher FR+EN</button>
      <span id="qpn" style="color:var(--muted);font-size:13px;margin-left:4px"></span>
    </div>
    <div id="qdoc"></div>
  </div>
</div>
<div id="client-picker" class="client-picker hidden">
  <div class="client-picker-box">
    <h3>👥 Choisir un client</h3>
    <input id="client-search" style="width:100%;padding:8px 11px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;outline:none;font-family:inherit;margin-bottom:10px" placeholder="Rechercher un client..." oninput="filterClients()">
    <div id="client-picker-list"></div>
    <button class="btn bg" style="width:100%;padding:9px;margin-top:8px;font-size:13px" onclick="document.getElementById('client-picker').classList.add('hidden')">Annuler</button>
  </div>
</div>
<div id="import-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3>🤖 Importer une réservation</h3>
    <p>Collez le texte de n&#39;importe quel <strong>email ou message</strong> contenant les infos de réservation.</p>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button id="tab-email" class="btn bb" onclick="setImportTab('email')" style="font-size:12px;padding:6px 13px">✉️ Email (tout format)</button>
      <button id="tab-whatsapp" class="btn bg" onclick="setImportTab('whatsapp')" style="font-size:12px;padding:6px 13px;background:#25D366;color:#fff">💬 WhatsApp</button>
    </div>
    <div id="import-hint" style="background:#F3F7FC;border-radius:8px;padding:8px 12px;font-size:12px;color:#7A97B5;margin-bottom:8px;line-height:1.5"></div>
    <textarea id="email-input" placeholder="Collez ici..."></textarea>
    <div id="ai-result-box" class="ai-result hidden"></div>
    <div class="modal-actions">
      <button class="blg" id="btn-analyze" onclick="analyzeEmail()" style="font-size:13px">🤖 Analyser</button>
      <button class="btn bb hidden" id="btn-import-confirm" onclick="confirmImport()" style="padding:12px 18px;font-size:13px">✓ Importer</button>
      <button class="btn bg" onclick="closeImportModal()" style="padding:12px 18px;font-size:13px">Annuler</button>
    </div>
  </div>

// ── CONFIG FIREBASE ──
var CFG={dbUrl:''};
try{CFG=JSON.parse(localStorage.getItem('cren-cfg')||'{}');}catch(e){}
function saveCfg(){localStorage.setItem('cren-cfg',JSON.stringify(CFG));}

// ── DATA ──
var RES=[],DRV=[{id:'d1',name:'Lucnor LAROCHEL',vehicle:'Tesla Model Y',plate:'GK-580-RX',updatedAt:'0'}];
function loadLocal(){
  try{var r=localStorage.getItem('cren-res'),d=localStorage.getItem('cren-drv');
  if(r)RES=JSON.parse(r);if(d)DRV=JSON.parse(d);}catch(e){}
}
function migrateSvcNames(){
  var changed=false;
  SVC=SVC.map(function(s){var n=s.name;
    if(n.indexOf('1-3 PAX')!==-1){n=n.replace('1-3 PAX','Berline');changed=true;}
    if(n.indexOf('4-7 PAX')!==-1){n=n.replace('4-7 PAX','Van');changed=true;}
    return changed?Object.assign({},s,{name:n,updatedAt:new Date().toISOString()}):s;});
  if(changed)saveServices();
}
function saveLocal(){localStorage.setItem('cren-res',JSON.stringify(RES));localStorage.setItem('cren-drv',JSON.stringify(DRV));}
loadLocal();

// ── SYNC FIREBASE ──
function setSS(state,lbl){
  var p=document.getElementById('sp'),l=document.getElementById('slbl'),d=document.getElementById('sdot');
  p.className=state;l.textContent=lbl;
  d.className='sdot'+(state==='syncing'?' spinning':'');
}
function fbUrl(){return(CFG.dbUrl||'').replace(/\/+$/,'')+'/crenolia.json';}
function applyRemote(remote){
  if(!remote)return false;
  if(Array.isArray(remote.reservations))RES=remote.reservations;
  if(Array.isArray(remote.drivers)&&remote.drivers.length)DRV=remote.drivers;
  if(Array.isArray(remote.clients))CLI=remote.clients;
  if(Array.isArray(remote.services)&&remote.services.length)SVC=remote.services;
  if(Array.isArray(remote.channels)&&remote.channels.length)CHAN=remote.channels;
  if(Array.isArray(remote.revenue))REV=remote.revenue;
  saveLocal();saveClients();saveServices();saveChannels();saveRevenue();
  return true;
}
function renderCurrent(){
  if(CV==='list')renderList();
  else if(CV==='drivers')renderDrivers();
  else if(CV==='clients')renderClients();
  else if(CV==='services')renderServices();
  else if(CV==='dashboard')renderDashboard();
}
function pullData(silent){
  if(!CFG.dbUrl)return Promise.resolve();
  if(!silent)setSS('syncing','Sync...');
  return fetch(fbUrl())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(remote){
      if(remote&&(remote.reservations||remote.drivers||remote.clients||remote.services||remote.channels||remote.revenue)){
        applyRemote(remote);renderCurrent();
        var t=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
        setSS('ok','OK '+t);
      }else{pushData();}
    })
    .catch(function(e){setSS('err','Erreur sync');console.error('pullData',e);});
}
function syncNow(){if(!CFG.dbUrl){showView('settings');return;}pullData(false);}
function forcePull(){
  if(!CFG.dbUrl)return;
  if(!confirm('Importer toutes les données depuis Firebase ?'))return;
  setSS('syncing','Import...');
  fetch(fbUrl())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(remote){
      if(remote){
        if(Array.isArray(remote.reservations))RES=remote.reservations;
        if(Array.isArray(remote.drivers))DRV=remote.drivers;
        if(Array.isArray(remote.clients))CLI=remote.clients;
        if(Array.isArray(remote.services)&&remote.services.length)SVC=remote.services;
        if(Array.isArray(remote.channels)&&remote.channels.length)CHAN=remote.channels;
        if(Array.isArray(remote.revenue))REV=remote.revenue;
        saveLocal();saveClients();saveServices();saveChannels();saveRevenue();
      }
      var t=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

function pushData(){

    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);

// ── GOOGLE CALENDAR ──
function addToCalendar(id){
  var r=RES.find(function(x){return x.id===id;});
  if(!r||!r.pickupDate){alert('Date de prise en charge manquante');return;}
  var dp=r.pickupDate.replace(/-/g,'');
  var tp=(r.pickupTime||'00:00').replace(':','')+'00';
  var startDT=dp+'T'+tp;
  var startMs=new Date(r.pickupDate+'T'+(r.pickupTime||'00:00')+':00').getTime();
  var endDate=new Date(startMs+3600000);
  var endDT=endDate.getFullYear()+String(endDate.getMonth()+1).padStart(2,'0')+String(endDate.getDate()).padStart(2,'0')+'T'+String(endDate.getHours()).padStart(2,'0')+String(endDate.getMinutes()).padStart(2,'0')+'00';
  var drv=DRV.find(function(d){return d.id===r.driverId;});
  var title=encodeURIComponent('VTC — '+(r.passengerName||'Client')+(r.flightNumber?' ('+r.flightNumber+')':''));
  var details=[];
  if(r.passengerName)details.push('Client : '+r.passengerName);
  if(r.phone)details.push('Tél : '+r.phone);
  if(r.flightNumber)details.push('Vol : '+r.flightNumber);
  if(r.passengerCount)details.push('Passagers : '+r.passengerCount);
  if(r.fare)details.push('Tarif : '+r.fare+'€');
  if(drv)details.push('Chauffeur : '+drv.name+' — '+drv.vehicle+' '+drv.plate);
  if(r.isSubcontracted&&r.subcontractorName)details.push('Sous-traitant : '+r.subcontractorName+(r.subcontractorFare?' ('+r.subcontractorFare+'€)':''));
  var loc=encodeURIComponent((r.pickupLocation||'')+(r.destination?' → '+r.destination:''));
  var url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+title+'&dates='+startDT+'/'+endDT+'&details='+encodeURIComponent(details.join('\n'))+'&location='+loc;
  window.open(url,'_blank');
}

function _monthNum(s){s=(s||'').toLowerCase().slice(0,4);var m={jan:1,fev:2,'fév':2,feb:2,mar:3,avr:4,apr:4,mai:5,may:5,jui:6,jun:6,juin:6,jul:7,aou:8,aug:8,'aoû':8,sep:9,oct:10,nov:11,dec:12,'déc':12};for(var k in m){if(s.indexOf(k)===0)return m[k];}return 0;}

function _toISO(y,mo,d){if(!y||!mo||!d)return '';y=String(y);if(y.length===2)y='20'+y;return y+'-'+_pad(mo)+'-'+_pad(d);}
function parseLocal(text){
  var now=new Date();
  var d={passengerName:'',phone:'',passengerCount:'',pickupDate:'',pickupTime:'',pickupLocation:'',destination:'',flightNumber:'',fare:'',orderedAt:now.toLocaleDateString('fr-FR')+' '+now.toTimeString().slice(0,5)};
  text=text.replace(/^\s*\[\d{1,2}:\d{2}(?::\d{2})?,?\s*\d{1,2}\/\d{1,2}\/\d{2,4}\]\s*[^:\n]{0,40}:\s?/gm,'');
  var lines=text.split(/\r?\n/);
  function after(labels,allowNext){for(var k=0;k<labels.length;k++){var labLow=labels[k].toLowerCase();for(var i=0;i<lines.length;i++){var line=lines[i],low=line.toLowerCase(),idx=low.indexOf(labLow);if(idx===-1)continue;var before=idx===0?'':low.charAt(idx-1);var afterCh=low.charAt(idx+labLow.length);if(/[a-zà-ÿ0-9]/.test(before))continue;if(/[a-zà-ÿ]/.test(afterCh))continue;var rest=line.slice(idx+labels[k].length).replace(/^[:\s.\-]+/,'').trim();if(rest)return rest;if(allowNext){for(var j=i+1;j<lines.length;j++){if(lines[j].trim())return lines[j].trim();}}}}return '';}
  var ph=text.match(/(\+?\d[\d\s().\-]{7,}\d)/);if(ph)d.phone=ph[1].replace(/[\s().\-]+/g,'').replace(/^00/,'+');
  var pc=text.match(/(\d+)[ \t]{0,2}(?:x[ \t]*)?(?:adults?|passengers?|pax|personnes?|participant|adultes?|people|voyageurs?)\b/i);if(pc)d.passengerCount=pc[1];else{var pax=after(['PAX','Nombre de participant','Passagers','Participants'],false);var pm=pax.match(/\d+/);if(pm)d.passengerCount=pm[0];}
  var fare=text.match(/(\d{1,5}(?:[.,]\d{1,2})?)\s*(?:€|EUR)/i)||text.match(/(?:€|EUR|prix|amount|tarif|montant|price)\s*:?\s*(\d{1,5}(?:[.,]\d{1,2})?)/i);if(fare){d.fare=fare[1].replace(',','.').replace(/\.00$/,'');}
  var iso=text.match(/\b(20\d{2})-(\d{1,2})-(\d{1,2})\b/);var enUS=text.match(/\b([A-Za-zéûàô]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*'?(\d{2,4})\b/);var enDM=text.match(/\b(\d{1,2})(?:st|nd|rd|th)?[.\s]+([A-Za-zéûàô]{3,9})\.?\s*'?(\d{2,4})\b/);var dmy=text.match(/\b(\d{1,2})[\/.](\d{1,2})[\/.](20\d{2}|\d{2})\b/);
  if(iso)d.pickupDate=_toISO(iso[1],iso[2],iso[3]);else if(enDM&&_monthNum(enDM[2]))d.pickupDate=_toISO(enDM[3],_monthNum(enDM[2]),enDM[1]);else if(enUS&&_monthNum(enUS[1]))d.pickupDate=_toISO(enUS[3],_monthNum(enUS[1]),enUS[2]);else if(dmy)d.pickupDate=_toISO(dmy[3],dmy[2],dmy[1]);
  var tm=text.match(/(\d{1,2}):(\d{2})\s*([ap]\.?m\.?)/i)||text.match(/(?:heure|time|pickup|pick-up|départ|depart|arriv)\D{0,12}(\d{1,2}):(\d{2})/i)||text.match(/\b(\d{1,2}):(\d{2})\b/);
  if(tm){var H=parseInt(tm[1],10),M=tm[2],ap=(tm[3]||'').toLowerCase();if(ap.indexOf('p')===0&&H<12)H+=12;if(ap.indexOf('a')===0&&H===12)H=0;d.pickupTime=_pad(H)+':'+M;}
  var fl=text.match(/(?:flight|vol)[^A-Za-z\d]{0,12}([A-Z]{2,3}\s?\d{2,4})/i)||text.match(/\b([A-Z]{2,3}\d{2,4})\b/);if(fl)d.flightNumber=fl[1].replace(/\s+/g,'').toUpperCase();
  d.passengerName=after(['Client·e principal·e','Client principal','Customer','Nom du passager','Nom passager','Voyageur','Passager','Passenger','Name','Nom','Client'],false);
  d.passengerName=d.passengerName.replace(/\S+@\S+/,'').replace(/\s{2,}/g,' ').trim();
  if(/^\d|@|http/i.test(d.passengerName))d.passengerName='';
  var pu=after(['Pick-up','Pickup','Pick up Location','Prise en charge','Lieu de prise'],false);var dz=after(['Drop Off Location','Drop-off','Dropoff','Destination','Dépôt'],false);
  var fromTo=text.match(/(?:from|de)\s+([A-Za-zÀ-ÿ0-9 ,.'\-]{2,40}?)\s+(?:to|vers|jusqu'?à|->|→)\s+([A-Za-zÀ-ÿ0-9 ,.'\-]{2,40})/i);if(fromTo){if(!pu)pu=fromTo[1].trim();if(!dz)dz=fromTo[2].trim();}
  var gyg=text.match(/De\s+(.+?)\s+vers\s+(.+)/i);if(gyg){if(!pu)pu=gyg[1].trim();if(!dz)dz=gyg[2].trim();}
  d.pickupLocation=pu||'';d.destination=dz||'';
  return d;
}

var REV_COLORS=['#0066CC','#6C3483','#E67E22','#27AE60','#C0392B','#16A085','#8E44AD','#D35400','#2980B9','#7F8C8D'];
var MONTHS_FR=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];

function revHash(s){var h=0;s=String(s);for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function chColor(name){var i=CHAN.indexOf(name);if(i<0)i=revHash(name);return REV_COLORS[i%REV_COLORS.length];}
function eur(n){n=Math.round((+n||0)*100)/100;return n.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';}

function filterRevRows(){
  return REV.filter(function(r){
    if(!r.date)return false;
    if(DASH_YEAR==='all')return true;
    if(!inFY(r.date,DASH_YEAR))return false;
    if(DASH_PERIOD==='year')return true;
    var d=new Date(r.date),y=d.getFullYear(),m=d.getMonth();var p=parseFY(DASH_YEAR);
    if(DASH_PERIOD==='q1')return y===p[0]&&m>=3&&m<=5;
    if(DASH_PERIOD==='q2')return y===p[0]&&m>=6&&m<=8;
    if(DASH_PERIOD==='q3')return y===p[0]&&m>=9&&m<=11;
    if(DASH_PERIOD==='q4')return y===p[1]&&m>=0&&m<=2;
    if(DASH_PERIOD[0]==='m')return r.date.slice(0,7)===DASH_PERIOD.slice(1);
    return true;
  });
}
function periodLabel(){
  if(DASH_YEAR==='all')return 'Toutes périodes';
  var base='Exercice '+DASH_YEAR;
  if(DASH_PERIOD==='year')return base+' (avr.→mars)';
  if(DASH_PERIOD==='q1')return base+' — T1 (Avr-Juin)';
  if(DASH_PERIOD==='q2')return base+' — T2 (Juil-Sep)';
  if(DASH_PERIOD==='q3')return base+' — T3 (Oct-Déc)';
  if(DASH_PERIOD==='q4')return base+' — T4 (Jan-Mar)';
  if(DASH_PERIOD[0]==='m'){var pts=DASH_PERIOD.slice(1).split('-');return base+' — '+MONTHS_FR[parseInt(pts[1])-1]+' '+pts[0];}
  return base;
}
function buildMonthOptions(fy){
  if(fy==='all')return '';var p=parseFY(fy),opts='';
  FY_MONTHS.forEach(function(jsM,i){var y=i<=8?p[0]:p[1];var iso=y+'-'+(jsM+1<10?'0'+(jsM+1):String(jsM+1));var key='m'+iso;opts+='<option value="'+key+'"'+(DASH_PERIOD===key?' selected':'')+'>'+FY_LABELS[i]+' '+y+'</option>';});
  return opts;
}
function isActiveMonth(fi){
  if(DASH_PERIOD==='year')return true;if(DASH_PERIOD==='q1')return fi<=2;if(DASH_PERIOD==='q2')return fi>=3&&fi<=5;if(DASH_PERIOD==='q3')return fi>=6&&fi<=8;if(DASH_PERIOD==='q4')return fi>=9;
  if(DASH_PERIOD[0]==='m'){var jsM=parseInt(DASH_PERIOD.slice(1).split('-')[1])-1;return FY_MONTHS[fi]===jsM;}return true;
}

    recentRides.forEach(function(r){var ds=r.pickupDate?new Date(r.pickupDate).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'—';var isSub=r.isSubcontracted&&r.subcontractorName;h+='<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EEF3F8;flex-wrap:wrap"><div style="min-width:90px;font-size:11px;color:var(--muted)">'+ds+' '+(r.pickupTime||'')+'</div><div style="flex:1;min-width:140px"><div style="font-size:13px;font-weight:600;color:#0E3460">'+E(r.passengerName||'—')+'</div><div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(r.pickupLocation||'')+(r.destination?' → '+r.destination:'')+'</div>'+(isSub?'<div style="font-size:10px;color:#9B5500">🔄 '+E(r.subcontractorName)+'</div>':'')+'</div>'+(r.passengerCount?'<span class="tag tb" style="font-size:10px">'+r.passengerCount+' pax</span>':'')+(isSub&&r.subcontractorFare?'<span style="font-size:12px;color:#9B5500;font-weight:700">ST:'+r.subcontractorFare+'€</span>':'')+(r.fare&&!isSub?'<span style="font-size:14px;font-weight:800;color:var(--blue)">'+r.fare+' €</span>':'')+'<div style="display:flex;gap:5px"><button class="btn bg" style="font-size:11px;padding:4px 8px" onclick="openForm(\''+r.id+'\')">✏️</button><button class="btn bo" style="font-size:11px;padding:4px 8px" onclick="openVoucher(\''+r.id+'\',\'client\')">🖨</button></div></div>';});
    h+='</div>';
  }

  h+='</div>';
  el.innerHTML=h;
}

// ── REV MODAL ──
function openRevModal(id){
  var r=id?REV.find(function(x){return x.id===id;}):null;var today=new Date().toISOString().slice(0,10);
  var ov=document.createElement('div');ov.id='rev-modal-overlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px';
  var opts=CHAN.map(function(c){return'<option value="'+E(c)+'"'+(r&&r.channel===c?' selected':'')+'>'+E(c)+'</option>';}).join('');
  var h='<div class="modal" data-id="'+(id||'')+'" style="background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;max-height:90vh;overflow:auto"><h3 style="font-size:16px;font-weight:700;color:#0E3460;margin-bottom:16px">'+(id?'Modifier l\'entrée':'Nouvelle entrée CA')+'</h3><div class="fl"><label>Canal</label><select id="rev-ch">'+opts+'</select></div><div class="fl"><label>Date de la période</label><input id="rev-date" type="date" value="'+(r?E(r.date||today):today)+'"></div><div class="fl"><label>Montant CA brut (€)</label><input id="rev-amt" type="number" step="0.01" min="0" value="'+(r?E(r.amount):'')+'" placeholder="Ex: 3818.71"></div><div class="fl"><label>Note (facultatif)</label><input id="rev-note" value="'+(r?E(r.note||''):'')+'" placeholder="Ex: Sommaire fiscal avril 2026"></div><button class="btn bg" style="width:100%;font-size:12px;padding:8px;margin-bottom:14px" onclick="openRevDevisPicker()">🧾 Pré-remplir depuis un devis</button><div style="display:flex;gap:8px"><button class="btn bb" style="flex:1;padding:11px;font-size:14px" onclick="saveRevModal()">✓ Enregistrer</button><button class="btn bg" style="padding:11px 18px;font-size:14px" onclick="document.getElementById(&quot;rev-modal-overlay&quot;).remove()">Annuler</button></div></div>';
  ov.innerHTML=h;ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});document.body.appendChild(ov);
}
function saveRevModal(){
  var ov=document.getElementById('rev-modal-overlay');if(!ov)return;var id=ov.querySelector('.modal').getAttribute('data-id');
  var ch=document.getElementById('rev-ch').value;var date=document.getElementById('rev-date').value;var amt=parseFloat(document.getElementById('rev-amt').value);var note=document.getElementById('rev-note').value.trim();
  if(!date||isNaN(amt)){alert('Indiquez au moins une date et un montant valides.');return;}
  if(id){var r=REV.find(function(x){return x.id===id;});if(r){r.channel=ch;r.date=date;r.amount=amt;r.note=note;r.updatedAt=new Date().toISOString();}}
  else{REV.push({id:'rv'+Date.now()+Math.floor(Math.random()*1000),channel:ch,date:date,amount:amt,note:note,source:(ov.dataset.src||'manual'),updatedAt:new Date().toISOString()});}
  saveRevenue();pushData();ov.remove();renderDashboard();
}
function deleteRevenue(id){if(!confirm('Supprimer cette entrée de CA ?'))return;REV=REV.filter(function(x){return x.id!==id;});saveRevenue();pushData();renderDashboard();}
function openRevDevisPicker(){
  var ov=document.createElement('div');ov.id='rev-devis-overlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1100;padding:16px';
  var h='<div style="background:#fff;border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:80vh;overflow:auto"><h3 style="font-size:15px;font-weight:700;color:#0E3460;margin-bottom:12px">Choisir un devis / réservation</h3>';
  var list=RES.slice().sort(function(a,b){return(b.pickupDate||'').localeCompare(a.pickupDate||'');});
  if(!list.length)h+='<p style="color:#aaa;font-size:13px;text-align:center;padding:14px">Aucune réservation.</p>';
  list.forEach(function(r){var nm=r.passengerName||r.clientName||'—',d=r.pickupDate?r.pickupDate.split('-').reverse().join('/'):'';h+='<div onclick="fillRevFromRes(\''+r.id+'\')" style="cursor:pointer;padding:9px 11px;border:1px solid #E8EEF5;border-radius:9px;margin-bottom:7px;display:flex;justify-content:space-between;gap:10px"><div style="min-width:0"><div style="font-weight:600;color:#0E3460;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(nm)+'</div><div style="font-size:11px;color:#9AABBC">'+d+'</div></div><div style="font-weight:700;color:var(--blue);white-space:nowrap">'+(r.fare?eur(r.fare):'—')+'</div></div>';});
  h+='<button class="btn bg" style="width:100%;padding:9px;font-size:13px;margin-top:6px" onclick="document.getElementById(&quot;rev-devis-overlay&quot;).remove()">Fermer</button></div>';
  ov.innerHTML=h;ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});document.body.appendChild(ov);
}
function fillRevFromRes(id){
  var r=RES.find(function(x){return x.id===id;});if(!r)return;
  var amtEl=document.getElementById('rev-amt'),dEl=document.getElementById('rev-date'),chEl=document.getElementById('rev-ch'),nEl=document.getElementById('rev-note');
  if(amtEl&&r.fare)amtEl.value=r.fare;if(dEl&&r.pickupDate)dEl.value=r.pickupDate;
  if(chEl){for(var i=0;i<chEl.options.length;i++){if(/cr[ée]nolia|site/i.test(chEl.options[i].value)){chEl.value=chEl.options[i].value;break;}}}
  if(nEl&&!nEl.value)nEl.value=(r.passengerName||r.clientName||'');
  var mo=document.getElementById('rev-modal-overlay');if(mo)mo.dataset.src='devis';
  var dov=document.getElementById('rev-devis-overlay');if(dov)dov.remove();
}
function openChanModal(){
  var ov=document.createElement('div');ov.id='chan-modal-overlay';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px';
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});document.body.appendChild(ov);renderChanModal();
}
function renderChanModal(){
  var ov=document.getElementById('chan-modal-overlay');if(!ov)return;
  var h='<div style="background:#fff;border-radius:14px;padding:20px;max-width:400px;width:100%;max-height:85vh;overflow:auto"><h3 style="font-size:16px;font-weight:700;color:#0E3460;margin-bottom:14px">Canaux de vente</h3>';
  CHAN.forEach(function(c,i){h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EEF3F8"><span style="font-size:13px;color:#0E3460"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+chColor(c)+';margin-right:7px"></span>'+E(c)+'</span><button class="btn br" style="font-size:11px;padding:4px 8px" onclick="removeChannel('+i+')">🗑</button></div>';});
  h+='<div style="display:flex;gap:8px;margin-top:14px"><input id="chan-new" placeholder="Nouveau canal" style="flex:1;padding:8px 11px;border:1.5px solid var(--brd);border-radius:8px;font-size:13px;font-family:inherit;outline:none" onkeydown="if(event.key===\'Enter\')addChannel()"><button class="btn bb" style="font-size:13px;padding:8px 14px" onclick="addChannel()">+ Ajouter</button></div>';
  h+='<button class="btn bg" style="width:100%;padding:10px;font-size:13px;margin-top:14px" onclick="document.getElementById(\'chan-modal-overlay\').remove()">Fermer</button></div>';
  ov.innerHTML=h;
}
function addChannel(){var inp=document.getElementById('chan-new');if(!inp)return;var v=inp.value.trim();if(!v)return;if(CHAN.indexOf(v)<0){CHAN.push(v);saveChannels();pushData();}renderChanModal();renderDashboard();}
function removeChannel(i){if(i<0||i>=CHAN.length)return;if(!confirm('Supprimer le canal "'+CHAN[i]+'" ?'))return;CHAN.splice(i,1);saveChannels();pushData();renderChanModal();renderDashboard();}

// ── PDF IMPORT ──
function loadPdfJs(){return new Promise(function(resolve,reject){var lib=window.pdfjsLib||window['pdfjs-dist/build/pdf'];if(lib){resolve(lib);return;}var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=function(){var l=window.pdfjsLib||window['pdfjs-dist/build/pdf'];if(l){try{l.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}resolve(l);}else reject(new Error('pdfjs introuvable'));};s.onerror=function(){reject(new Error('Chargement de pdf.js échoué'));};document.head.appendChild(s);});}
function importRevenuePDF(){var inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';inp.onchange=function(){var f=inp.files&&inp.files[0];if(f)handleRevenuePDF(f);};inp.click();}
function handleRevenuePDF(file){
  var ov=document.createElement('div');ov.id='pdf-busy';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1200;color:#fff;font-size:15px';ov.innerHTML='<div style="background:#0E3460;padding:20px 28px;border-radius:12px"><span class="spinner"></span> Lecture du PDF...</div>';document.body.appendChild(ov);
  loadPdfJs().then(function(lib){var reader=new FileReader();reader.onload=function(){var data=new Uint8Array(reader.result);lib.getDocument({data:data}).promise.then(function(pdf){var pages=[];for(var p=1;p<=pdf.numPages;p++)pages.push(p);return pages.reduce(function(chain,p){return chain.then(function(acc){return pdf.getPage(p).then(function(pg){return pg.getTextContent();}).then(function(tc){return acc+tc.items.map(function(it){return it.str;}).join(' ')+'\n';});});},Promise.resolve(''));}).then(function(text){ov.remove();analyzeRevenueText(text);}).catch(function(e){ov.remove();alert('Lecture du PDF impossible : '+e.message);});};reader.onerror=function(){ov.remove();alert('Lecture du fichier impossible.');};reader.readAsArrayBuffer(file);}).catch(function(e){ov.remove();alert(e.message);});
}
function analyzeRevenueText(text){
  var local=parseRevenueLocal(text);if(local&&local.amount){openRevModalPrefilled(local,'pdf');return;}
  var ov=document.createElement('div');ov.id='pdf-busy';ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1200;color:#fff';ov.innerHTML='<div style="background:#0E3460;padding:20px 28px;border-radius:12px"><span class="spinner"></span> Analyse IA...</div>';document.body.appendChild(ov);
  fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.slice(0,12000),mode:'revenue'})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(res){ov.remove();var ai=null;try{ai=JSON.parse(String(res.raw||'').replace(/```json/g,'').replace(/```/g,'').trim());}catch(e){}if(ai&&ai.amount){openRevModalPrefilled({amount:ai.amount,date:ai.date||'',channel:ai.channel||''},'pdf');}else if(local){openRevModalPrefilled(local,'pdf');}else{alert('Montant introuvable. Saisissez-le manuellement.');openRevModal(null);}})
    .catch(function(e){ov.remove();if(local){openRevModalPrefilled(local,'pdf');}else{alert('IA indisponible. Saisie manuelle.');openRevModal(null);}});
}
function parseRevenueLocal(text){
  var d={amount:'',date:'',channel:''};
  if(/\buber\b/i.test(text))d.channel='Uber';
  else if(/getyourguide/i.test(text))d.channel='GetYourGuide';
  else if(/viator/i.test(text))d.channel='Viator';
  else if(/\bsixt\b/i.test(text))d.channel='Sixt';
  else if(/\bmaze\b/i.test(text))d.channel='Maze';
  var m=null;
  if(d.channel==='Uber'){
    m=text.match(/total\s+des\s+revenus[^0-9€]{0,20}([0-9][0-9\s]*[.,]\d{2})\s*€/i);
    if(!m)m=text.match(/vos\s+revenus[^0-9€]{0,20}([0-9][0-9\s]*[.,]\d{2})\s*€/i);
    if(!m)m=text.match(/revenus?[^0-9€]{0,20}([0-9][0-9\s]*[.,]\d{2})\s*€/i);
  }else if(d.channel==='GetYourGuide'){
    m=text.match(/total\s+bookings[^0-9]{0,20}([0-9]+[.,]\d{2})/i);
  }else if(d.channel==='Viator'){
    m=text.match(/gross\s+booking\s+value[^0-9]{0,10}([0-9]+[.,]\d{2})/i)||text.match(/total\s+bookings[^0-9]{0,10}([0-9]+[.,]\d{2})/i)||text.match(/supplier\s+payout[^0-9]{0,10}([0-9]+[.,]\d{2})/i);
  }else{
    m=text.match(/(?:total\s+des\s+revenus|vos\s+revenus|total\s+bookings|gross\s+booking|montant\s+total|payout|earnings)[^0-9€]{0,20}([0-9][0-9\s]*[.,]\d{2})\s*€?/i);
  }
  if(m)d.amount=parseFloat(m[1].replace(/\s/g,'').replace(',','.'));
  var moisFR={janvier:1,'février':2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,'août':8,aout:8,septembre:9,octobre:10,novembre:11,'décembre':12,decembre:12,january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
  var enDate=text.match(/([A-Za-z]{3,9})\s+(\d{1,2})(?:st|nd|rd|th)?\s*(?:[-–]\s*\d+)?,?\s*(\d{4})/i);
  if(enDate){var mn=(enDate[1]||'').toLowerCase();if(moisFR[mn]){var mm2=moisFR[mn];d.date=enDate[3]+'-'+(mm2<10?'0'+mm2:mm2)+'-'+(enDate[2].length<2?'0'+enDate[2]:enDate[2]);}}
  if(!d.date){var frDate=text.match(/(\d{1,2})[-–]\d{1,2}\s+([A-Za-zéûôàùèê]{3,9})\s+(20\d{2})/i);if(frDate){var mn2=(frDate[2]||'').toLowerCase();if(moisFR[mn2]){var mm3=moisFR[mn2];d.date=frDate[3]+'-'+(mm3<10?'0'+mm3:mm3)+'-'+(frDate[1].length<2?'0'+frDate[1]:frDate[1]);}}}
  if(!d.date){var iso=text.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);if(iso)d.date=iso[1]+'-'+iso[2]+'-'+iso[3];}
  return d;
}
function openRevModalPrefilled(data,src){
  openRevModal(null);var mo=document.getElementById('rev-modal-overlay');if(mo)mo.dataset.src=src||'pdf';
  var amtEl=document.getElementById('rev-amt'),dEl=document.getElementById('rev-date'),chEl=document.getElementById('rev-ch');
  if(amtEl&&data.amount)amtEl.value=data.amount;if(dEl&&data.date)dEl.value=data.date;
  if(chEl&&data.channel){var found=false;for(var i=0;i<chEl.options.length;i++){if(chEl.options[i].value.toLowerCase()===String(data.channel).toLowerCase()){chEl.value=chEl.options[i].value;found=true;break;}}if(!found&&CHAN.indexOf(data.channel)<0){CHAN.push(data.channel);saveChannels();var o=document.createElement('option');o.value=data.channel;o.textContent=data.channel;o.selected=true;chEl.appendChild(o);}}
}
