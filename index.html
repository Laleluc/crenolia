<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crénolia — Réservations</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0066CC;--blue-dk:#0052A3;--blue-lt:#EBF4FB;--blue-brd:#D5E8F7;--txt:#1A2E45;--muted:#7A97B5;--bg:#F3F7FC;--wh:#fff;--brd:#C8DDF0;--red:#C0392B;--red-lt:#FEF5F5}
html,body{height:100%;font-family:"Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--txt)}
#hdr{background:var(--wh);border-bottom:2px solid var(--blue-brd);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:8px;flex-wrap:wrap}
#hdr img{height:38px;width:auto}
#nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nb{padding:7px 16px;border-radius:20px;border:1.5px solid var(--blue-brd);cursor:pointer;font-weight:500;font-size:13px;background:transparent;color:#666;font-family:inherit}
.nb.on{background:var(--blue-lt);color:var(--blue-dk);border:none}
.btn-new{padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--blue);color:var(--wh);font-family:inherit}
#sp{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:1.5px solid var(--blue-brd);font-family:inherit;transition:all .3s}
#sp.ok{background:#EBF7E3;color:#2C6E12;border-color:#A8D5A2}
#sp.syncing{background:#FFF5E6;color:#7A4800;border-color:#FFD699}
#sp.err{background:var(--red-lt);color:var(--red);border-color:#F5C6C2}
#sp.off{background:var(--bg);color:var(--muted);border-color:var(--blue-brd)}
.sdot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite}
#main{max-width:860px;margin:0 auto;padding:28px 16px}
.card{background:var(--wh);border-radius:12px;border:1.5px solid var(--blue-brd);padding:16px 20px;margin-bottom:10px;display:flex;gap:16px;align-items:flex-start}
.card.subc{border-color:#F0C080;background:#FFFDF7}
.cn{font-size:17px;font-weight:700;color:#0E3460;margin-bottom:4px}
.cm{font-size:13px;color:var(--muted);margin-bottom:10px}
.ct{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cd{font-size:12px;color:#99B0C8}
.ca{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.tag{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.tb{background:var(--blue-lt);color:var(--blue-dk)}.tg{background:#EBF7E3;color:#2C6E12}.to{background:#FFF5E6;color:#7A4800}.tst{background:#FFF0E0;color:#9B5500;border:1px solid #F0C080}
.btn{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;border:none;font-family:inherit}
.bb{background:var(--blue);color:var(--wh)}.bo{background:var(--wh);color:var(--blue);border:1.5px solid var(--blue)!important}.bg{background:var(--bg);color:#555}.br{background:var(--red-lt);color:var(--red)}.brc{background:#FDECEA;color:var(--red)}.bor{background:#FFF0E0;color:#9B5500;border:1.5px solid #F0C080!important}
.blg{flex:1;padding:13px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;font-family:inherit;background:var(--blue);color:var(--wh)}
.st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px;color:var(--muted)}.st.dm{color:#B0C4D8}
.emp{text-align:center;padding:60px 0}
.fw{max-width:580px;margin:0 auto}
.ft{font-size:20px;font-weight:700;color:#0E3460;margin-bottom:24px}
.sb{margin-bottom:20px}
.sbh{background:var(--blue);color:var(--wh);padding:7px 14px;border-radius:8px 8px 0 0;font-weight:700;font-size:12px;letter-spacing:1.2px}
.sbh.org{background:#E67E22}
.sbb{background:var(--wh);border:1.5px solid var(--blue-brd);border-top:none;border-radius:0 0 10px 10px;padding:16px 18px}
.sbb.orgb{border-color:#F0C080;background:#FFFDF7}
.fl{margin-bottom:12px}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
.fl label.er{color:var(--red)}
.fl input,.fl select{width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:14px;outline:none;font-family:inherit;background:var(--wh);color:var(--txt)}
.fl input.er,.fl select.er{border-color:#E74C3C}
.fl input:focus,.fl select:focus{border-color:var(--blue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ae{background:#FEF0EF;border:1.5px solid #F5C6C2;border-radius:8px;padding:10px 14px;margin-bottom:16px;color:var(--red);font-size:13px}
.chk-row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;user-select:none}
.chk-row input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#E67E22}
.chk-label{font-size:14px;font-weight:600;color:#9B5500}
.sub-info{background:#FFF8EE;border:1px solid #F0C080;border-radius:8px;padding:10px 14px;font-size:12px;color:#7A4800;margin-bottom:12px;line-height:1.6}
#vw{min-height:100vh;background:var(--bg)}
#vtb{background:var(--wh);border-bottom:1.5px solid var(--blue-brd);padding:10px 24px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap}
#vtb span{color:var(--muted);font-size:13px;margin-left:4px}
#vdoc{max-width:680px;margin:20px auto;background:var(--wh);padding:32px 44px;box-shadow:0 2px 20px rgba(0,0,0,.07);border-radius:4px}
.vt{text-align:center;font-weight:700;font-size:12.5px;margin-bottom:3px}
.vs2{text-align:center;font-size:10.5px;color:#555;line-height:1.5;margin-bottom:18px}
.va{font-size:11px;line-height:1.7;color:#333;margin-bottom:22px}
.vsec{background:var(--blue);color:var(--wh);padding:5px 12px;font-weight:700;font-size:11px;letter-spacing:1.2px}
.vsec.org{background:#E67E22}
.vtbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.vtbl td{padding:6px 12px;border-bottom:1px dashed var(--brd);vertical-align:top;font-size:12px;line-height:1.3}
.vtbl td:first-child{width:200px;font-weight:600;color:#444;font-size:11.5px}
.vtbl .bld td:last-child{font-weight:700}
.vf{text-align:center;padding-top:14px;border-top:1px solid #E8E8E8;margin-top:6px}
.vf img{height:52px;width:auto;margin:0 auto 6px;display:block}
.vft{font-size:10px;color:#666;line-height:1.7}
.sub-badge{display:inline-block;background:#FFF0E0;color:#9B5500;border:1px solid #F0C080;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;margin-bottom:12px;letter-spacing:.5px}
@media print{#vtb,#hdr{display:none!important}#vdoc{margin:0;padding:20px 30px;box-shadow:none;max-width:100%}body{background:#fff}.vtbl td{padding:4px 10px;font-size:11px}.vtbl td:first-child{font-size:10.5px}.vsec{padding:4px 10px;font-size:10px}.vt{font-size:11.5px}.vs2{font-size:10px;margin-bottom:12px}.va{font-size:10px;margin-bottom:14px;line-height:1.5}.vf img{height:40px}.vft{font-size:9px}}
#aw{position:fixed;inset:0;background:#0066CC;display:flex;align-items:center;justify-content:center;overflow:hidden}
#ac{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;z-index:10;background:linear-gradient(to bottom,rgba(0,80,160,.6),transparent)}
#ac button{background:rgba(255,255,255,.15);color:rgba(255,255,255,.85);border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:13px;font-family:inherit}
#an{color:#fff;font-weight:800;text-align:center;line-height:1.05;letter-spacing:-.02em;word-break:break-word;width:100%;text-transform:uppercase}
.dw{max-width:560px;margin:0 auto}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.dc{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.dn{font-weight:700;font-size:15px;color:#0E3460}.dm2{font-size:13px;color:var(--muted)}
.adf{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:12px;padding:20px;margin-bottom:16px}
.sw{max-width:560px;margin:0 auto}
.sbox2{background:var(--wh);border:1.5px solid var(--blue-brd);border-radius:12px;padding:22px;margin-bottom:16px}
.tip{background:#FFF5E6;border:1.5px solid #FFD699;border-radius:10px;padding:14px 18px;font-size:12px;color:#7A4800;line-height:1.7}
.ok-box{background:#EBF7E3;border:1.5px solid #A8D5A2;border-radius:12px;padding:18px 22px;margin-bottom:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="hdr">
  <img id="logo" alt="Crénolia">
  <div id="nav">
    <button class="nb on" onclick="showView('list')" id="nav-list">Réservations</button>
    <button class="nb" onclick="showView('drivers')" id="nav-drivers">Chauffeurs</button>
    <button class="nb" onclick="showView('settings')" id="nav-settings">⚙️ Sync</button>
    <button id="sp" class="off" onclick="syncNow()" title="Synchroniser">
      <span class="sdot" id="sdot"></span><span id="slbl">Non configuré</span>
    </button>
    <button class="btn-new" onclick="openForm(null)">+ Nouvelle</button>
  </div>
</div>
<div id="main">
  <div id="view-list"></div>
  <div id="view-form" class="hidden"></div>
  <div id="view-drivers" class="hidden"></div>
  <div id="view-settings" class="hidden"></div>
</div>
<div id="view-voucher" class="hidden">
  <div id="vw">
    <div id="vtb">
      <button class="btn bg" onclick="showView('list')">← Retour</button>
      <button class="btn bb" onclick="window.print()">🖨 Imprimer</button>
      <button class="btn bor" id="btn-stv" onclick="switchVMode()" style="display:none">📋 Voir bon ST</button>
      <span id="vpn"></span>
    </div>
    <div id="vdoc"></div>
  </div>
</div>
<div id="view-accueil" class="hidden">
  <div id="aw">
    <div id="ac">
      <button onclick="showView('list')">← Retour</button>
      <button id="bfs" onclick="toggleFS()">Plein écran</button>
    </div>
    <div id="an"></div>
  </div>
</div>

var CFG = {binId:'', apiKey:''};
try { CFG = JSON.parse(localStorage.getItem('cren-cfg') || '{}'); } catch(e) {}
function saveCfg() { localStorage.setItem('cren-cfg', JSON.stringify(CFG)); }
var JB = 'https://api.jsonbin.io/v3';

var RES = [], DRV = [{id:'d1', name:'Lucnor LAROCHEL', vehicle:'Tesla Model Y', plate:'GK-580-RX', updatedAt:'0'}];
function loadLocal() {
  try {
    var r = localStorage.getItem('cren-res'), d = localStorage.getItem('cren-drv');
    if (r) RES = JSON.parse(r);
    if (d) DRV = JSON.parse(d);
  } catch(e) {}
}
function saveLocal() {
  localStorage.setItem('cren-res', JSON.stringify(RES));
  localStorage.setItem('cren-drv', JSON.stringify(DRV));
}
loadLocal();

function setSS(state, lbl) {
  var p = document.getElementById('sp'), l = document.getElementById('slbl'), d = document.getElementById('sdot');
  p.className = state; l.textContent = lbl;
  d.className = 'sdot' + (state === 'syncing' ? ' spinning' : '');
}
function syncNow() {
  if (!CFG.binId || !CFG.apiKey) { showView('settings'); return; }
  setSS('syncing', 'Sync...');
  fetch(JB + '/b/' + CFG.binId + '/latest', {headers: {'X-Master-Key': CFG.apiKey}})
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      var remote = data.record;
      function merge(a, b) {
        var m = {};
        (a || []).concat(b || []).forEach(function(x) {
          if (!m[x.id] || (x.updatedAt || '') > (m[x.id].updatedAt || '')) m[x.id] = x;
        });
        return Object.values(m);
      }
      RES = merge(RES, remote.reservations);
      DRV = merge(DRV, remote.drivers);
      saveLocal();
      return fetch(JB + '/b/' + CFG.binId, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json', 'X-Master-Key': CFG.apiKey},
        body: JSON.stringify({reservations: RES, drivers: DRV, at: new Date().toISOString()})
      });
    })
    .then(function() {
      var t = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
      setSS('ok', 'OK ' + t);
      if (CV === 'list') renderList();
      if (CV === 'drivers') renderDrivers();
    })
    .catch(function(e) { setSS('err', 'Erreur sync'); console.error(e); });
}
function pushData() {
  if (!CFG.binId || !CFG.apiKey) return;
  fetch(JB + '/b/' + CFG.binId, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json', 'X-Master-Key': CFG.apiKey},
    body: JSON.stringify({reservations: RES, drivers: DRV, at: new Date().toISOString()})
  })
  .then(function() {
    var t = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    setSS('ok', 'OK ' + t);
  })
  .catch(function() { setSS('err', 'Erreur'); });
}
setInterval(function() { if (CFG.binId && CFG.apiKey) syncNow(); }, 60000);
if (CFG.binId && CFG.apiKey) { setSS('syncing', 'Sync...'); setTimeout(syncNow, 600); }

var CV = 'list';
function showView(v) {
  ['list','form','drivers','voucher','accueil','settings'].forEach(function(x) {
    var el = document.getElementById('view-' + x);
    if (el) el.classList.toggle('hidden', x !== v);
  });
  var fp = (v === 'voucher' || v === 'accueil');
  document.getElementById('main').classList.toggle('hidden', fp);
  document.getElementById('hdr').classList.toggle('hidden', v === 'accueil');
  ['list','drivers','settings'].forEach(function(x) {
    var b = document.getElementById('nav-' + x);
    if (b) b.classList.toggle('on', x === v);
  });

function E(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderList() {

  var now = new Date();
  function dt(r) { return new Date((r.pickupDate || '2000-01-01') + 'T' + (r.pickupTime || '00:00')); }
  var up = RES.filter(function(r) { return dt(r) >= now; }).sort(function(a,b) { return dt(a)-dt(b); });
  var pa = RES.filter(function(r) { return dt(r) < now; }).sort(function(a,b) { return dt(b)-dt(a); });

    + '<p style="font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6">Connectez <strong>JSONBin.io</strong> (gratuit) pour synchroniser en temps r&eacute;el entre tous vos appareils.</p>'
    + inner
    + '<div class="tip">Gratuit et s&eacute;curis&eacute;. 10 000 requ&ecirc;tes/mois, donn&eacute;es priv&eacute;es prot&eacute;g&eacute;es par votre cl&eacute; API.</div>'
    + '</div>';
}
function createBin() {
  var key = gv('cfg-key'); if (!key) { alert('Entrez votre Master Key'); return; }
  setSS('syncing', 'Cr&eacute;ation...');
  fetch(JB + '/b', {method:'POST', headers:{'Content-Type':'application/json','X-Master-Key':key,'X-Bin-Name':'Crenolia','X-Bin-Private':'true'}, body:JSON.stringify({reservations:RES,drivers:DRV,at:new Date().toISOString()})})
    .then(function(r){if(!r.ok)throw new Error('Cl\u00e9 invalide ('+r.status+')');return r.json();})
    .then(function(data){CFG={binId:data.metadata.id,apiKey:key};saveCfg();setSS('ok','OK');renderSettings();})
    .catch(function(e){setSS('err','Erreur');alert(e.message);});
}
function connectExisting() {
  var key = gv('cfg-key'), bid = gv('cfg-bid');
  if (!key || !bid) { alert('Remplissez les deux champs'); return; }
  CFG = {binId:bid, apiKey:key}; saveCfg(); syncNow(); renderSettings();
}
function disconnectSync() {
  if (!confirm('D\u00e9connecter ?')) return;
  CFG = {binId:'', apiKey:''}; saveCfg(); setSS('off', 'Non configur\u00e9'); renderSettings();
}

renderList();

</script>
</body>
